<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 - MNBT Store</title>
<link rel="stylesheet" href="/lib/layui/css/layui.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header-top" class="header"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>修改密码</h2>
    <form class="layui-form" id="password-form">
      <div class="layui-form-item">
        <input type="password" name="oldPassword" lay-verify="required" placeholder="旧密码" class="layui-input">
      </div>
      <div class="layui-form-item">
        <input type="password" name="newPassword" lay-verify="required" placeholder="新密码（至少6位）" class="layui-input">
      </div>
      <div class="layui-form-item">
        <input type="password" name="confirmPassword" lay-verify="required" placeholder="确认新密码" class="layui-input">
      </div>
      <div class="layui-form-item">
        <button type="button" lay-submit lay-filter="password" class="layui-btn layui-btn-fluid">修改密码</button>
      </div>
      <div style="text-align:center">
        <a href="/">返回首页</a>
      </div>
    </form>
  </div>
</div>

<script src="/lib/layui/layui.js"></script>
<script src="/js/app.js"></script>
<script>
layui.use('form', function () {
  var form = layui.form;

  form.on('submit(password)', function (data) {
    if (data.field.newPassword !== data.field.confirmPassword) {
      layer.msg('两次新密码不一致');
      return false;
    }
    M.put('/api/auth/password', {
      oldPassword: data.field.oldPassword,
      newPassword: data.field.newPassword
    }).then(function (res) {
      if (res.code === 0) {
        layer.msg('密码修改成功，请重新登录', function () {
          M.logout();
        });
      } else {
        layer.msg(res.msg || '修改失败');
      }
    });
    return false;
  });
});
</script>
</body>
</html>
