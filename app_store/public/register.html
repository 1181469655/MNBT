<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - MNBT Store</title>
<link rel="stylesheet" href="/lib/layui/css/layui.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header-top" class="header"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>注册</h2>
    <form class="layui-form" id="register-form">
      <div class="layui-form-item">
        <input type="text" name="username" lay-verify="required" placeholder="用户名（2-30位）" class="layui-input">
      </div>
      <div class="layui-form-item">
        <input type="email" name="email" lay-verify="required|email" placeholder="邮箱" class="layui-input">
      </div>
      <div class="layui-form-item">
        <input type="password" name="password" lay-verify="required" placeholder="密码（至少6位）" class="layui-input">
      </div>
      <div class="layui-form-item">
        <input type="password" name="confirm_password" lay-verify="required" placeholder="确认密码" class="layui-input">
      </div>
      <div class="layui-form-item">
        <div class="layui-input-inline" style="width:140px;">
          <input type="text" name="captcha" lay-verify="required" placeholder="验证码" class="layui-input">
        </div>
        <div class="layui-input-inline" style="width:120px;">
          <img src="/api/auth/captcha" id="captcha-img" alt="验证码" style="height:38px;cursor:pointer;border-radius:4px;" title="点击刷新">
        </div>
      </div>
      <div class="layui-form-item">
        <button type="button" lay-submit lay-filter="register" class="layui-btn layui-btn-fluid">注册</button>
      </div>
      <div style="text-align:center">
        <a href="/login.html">已有账号？立即登录</a>
      </div>
    </form>
  </div>
</div>

<script src="/lib/layui/layui.js"></script>
<script src="/js/app.js"></script>
<script>
layui.use('form', function () {
  var form = layui.form;

  var captchaImg = document.getElementById('captcha-img');
  captchaImg.addEventListener('click', function () {
    this.src = '/api/auth/captcha?t=' + Date.now();
  });

  form.on('submit(register)', function (data) {
    if (data.field.password !== data.field.confirm_password) {
      layer.msg('两次密码不一致');
      return false;
    }
    M.post('/api/auth/register', {
      username: data.field.username,
      email: data.field.email,
      password: data.field.password,
      captcha: data.field.captcha
    }).then(function (res) {
      if (res.code === 0) {
        layer.msg('注册成功', function () {
          location.href = '/';
        });
      } else {
        layer.msg(res.msg || '注册失败');
        captchaImg.src = '/api/auth/captcha?t=' + Date.now();
      }
    });
    return false;
  });
});
</script>
</body>
</html>
